global:
  scrape_interval: 2s
  scrape_timeout: 1500ms
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dukkan
    static_configs:
      - targets: ["gateway:8000"]
        labels: { service: gateway }
      - targets: ["auth:8000"]
        labels: { service: auth }
      - targets: ["inventory:8000"]
        labels: { service: inventory }
      - targets: ["orders:8000"]
        labels: { service: orders }
      - targets: ["payments:8000"]
        labels: { service: payments }
      - targets: ["psp:8000"]
        labels: { service: psp }
      - targets: ["fulfillment:8000"]
        labels: { service: fulfillment }
      - targets: ["catalog-sync:8000"]
        labels: { service: catalog-sync }
